            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Noto Serif SC', Roboto, serif;
            background: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 12px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .app {
            max-width: 1400px;
            width: 100%;
            background: var(--bg-app);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        .disclaimer-banner {
            background: #1a1a1a;
            color: #e8dccf;
            padding: 8px 20px;
            font-size: 12px;
            text-align: center;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }
        .disclaimer-banner strong {
            color: #f0d5b0;
        }

        .top-bar {
            padding: 12px 24px;
            background: var(--bg-app);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }
        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .logo span {
            color: var(--accent);
        }
        .top-bar .spacer {
            flex: 1;
        }
        .top-bar .settings-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-bar .settings-group label {
            font-size: 12px;
            color: var(--text-muted);
        }
        .top-bar .settings-group select,
        .top-bar .settings-group input[type="range"] {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 13px;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .top-bar .settings-group input[type="range"] {
            width: 80px;
            padding: 2px 6px;
            accent-color: var(--accent);
        }
