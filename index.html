<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 溪水旁 · 圣经文献阅读</title>
    <style>
        /* ===== CSS变量 ===== */
        :root {
            --bg-page: #f5f0eb;
            --bg-app: #ffffff;
            --bg-sidebar: #faf8f5;
            --bg-card: #f8f5f0;
            --bg-thought: #f3efe9;
            --bg-note: #fcfaf7;
            --text-primary: #2a241f;
            --text-secondary: #4a3f38;
            --text-muted: #8a7a6a;
            --border-color: #ede7e0;
            --accent: #b78c5f;
            --accent-hover: #9e764d;
            --font-size: 17px;
            --line-height: 2.2;
        }

        [data-theme="cream"] {
            --bg-page: #f5f0eb;
            --bg-app: #ffffff;
            --bg-sidebar: #faf8f5;
            --bg-card: #f8f5f0;
            --bg-thought: #f3efe9;
            --bg-note: #fcfaf7;
        }
        [data-theme="sepia"] {
            --bg-page: #f4ecd8;
            --bg-app: #faf3e6;
            --bg-sidebar: #f5ede0;
            --bg-card: #f0e8d8;
            --bg-thought: #ede4d2;
            --bg-note: #f5ede0;
            --border-color: #ddd0bc;
            --text-primary: #3d3228;
            --text-secondary: #5a4c3e;
        }
        [data-theme="gray"] {
            --bg-page: #e8e4e0;
            --bg-app: #f0ece8;
            --bg-sidebar: #eae6e2;
            --bg-card: #e6e2de;
            --bg-thought: #e2deda;
            --bg-note: #eae6e2;
            --border-color: #d5d0cc;
            --text-primary: #2c2a28;
            --text-secondary: #4a4642;
        }
        [data-theme="dark"] {
            --bg-page: #1a1816;
            --bg-app: #242220;
            --bg-sidebar: #2a2826;
            --bg-card: #2e2c2a;
            --bg-thought: #32302e;
            --bg-note: #2a2826;
            --border-color: #3d3a36;
            --text-primary: #e8e0d8;
            --text-secondary: #c8c0b8;
            --text-muted: #a09888;
            --accent: #c9a87c;
            --accent-hover: #dbb890;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Noto Serif SC', Roboto, serif;
            background: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 12px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .app {
            max-width: 1400px;
            width: 100%;
            background: var(--bg-app);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        .disclaimer-banner {
            background: #1a1a1a;
            color: #e8dccf;
            padding: 8px 20px;
            font-size: 12px;
            text-align: center;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }
        .disclaimer-banner strong {
            color: #f0d5b0;
        }

        .top-bar {
            padding: 12px 24px;
            background: var(--bg-app);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }
        .logo {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .logo span {
            color: var(--accent);
        }
        .top-bar .spacer {
            flex: 1;
        }
        .top-bar .settings-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-bar .settings-group label {
            font-size: 12px;
            color: var(--text-muted);
        }
        .top-bar .settings-group select,
        .top-bar .settings-group input[type="range"] {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-size: 13px;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .top-bar .settings-group input[type="range"] {
            width: 80px;
            padding: 2px 6px;
            accent-color: var(--accent);
        }

        .search-bar {
            padding: 8px 24px 12px 24px;
            background: var(--bg-app);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            transition: background 0.3s;
        }
        .search-bar input {
            flex: 2;
            min-width: 140px;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 60px;
            font-size: 14px;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
        }
        .search-bar input:focus {
            border-color: var(--accent);
        }
        .search-bar input::placeholder {
            color: var(--text-muted);
        }
        .search-bar select {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 60px;
            font-size: 13px;
            background: var(--bg-card);
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
        }
        .search-bar button {
            padding: 8px 22px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .search-bar button:hover {
            background: var(--accent-hover);
        }

        .progress-bar {
            padding: 6px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-secondary);
            transition: background 0.3s;
        }
        .progress-track {
            flex: 1;
            min-width: 100px;
            height: 5px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .main {
            display: flex;
            flex-direction: row;
            min-height: 55vh;
        }
        .sidebar {
            width: 200px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 12px 0;
            overflow-y: auto;
            max-height: 70vh;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .sidebar-group {
            margin-bottom: 12px;
        }
        .sidebar-group h4 {
            padding: 0 14px 4px 14px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-weight: 400;
        }
        .book-item {
            padding: 5px 14px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: 0.1s;
            border-left: 3px solid transparent;
        }
        .book-item:hover {
            background: var(--border-color);
            border-left-color: var(--accent);
        }
        .book-item.active {
            background: var(--bg-card);
            border-left-color: var(--accent);
            font-weight: 600;
            color: var(--text-primary);
        }

        .content {
            flex: 1;
            padding: 20px 28px;
            overflow-y: auto;
            max-height: 70vh;
            background: var(--bg-app);
            transition: background 0.3s;
        }
        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }
        .breadcrumb span {
            color: var(--accent);
            font-weight: 600;
        }

        .verse-text {
            font-size: var(--font-size);
            line-height: var(--line-height);
            color: var(--text-primary);
            transition: font-size 0.2s, line-height 0.2s;
        }
        .verse-text .v {
            color: var(--accent);
            font-weight: 500;
            margin-right: 4px;
            font-size: 0.8em;
        }
        .verse-text p {
            margin-bottom: 6px;
        }

        .badge-person {
            color: #c0392b;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px dotted #c0392b;
            padding: 0 2px;
            transition: 0.15s;
        }
        .badge-person:hover {
            background: rgba(192, 57, 43, 0.1);
            border-radius: 4px;
        }
        .badge-place {
            color: #2980b9;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px dotted #2980b9;
            padding: 0 2px;
            transition: 0.15s;
        }
        .badge-place:hover {
            background: rgba(41, 128, 185, 0.1);
            border-radius: 4px;
        }

        .search-results {
            margin-top: 12px;
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: none;
            max-height: 260px;
            overflow-y: auto;
            transition: background 0.3s;
        }
        .search-results.active {
            display: block;
        }
        .search-results .result-item {
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .search-results .result-item:hover {
            color: var(--accent);
        }
        .search-results .result-item .ref {
            color: var(--accent);
            font-weight: 600;
            margin-right: 8px;
        }
        .search-results .no-result {
            color: var(--text-muted);
            font-style: italic;
            font-size: 14px;
            padding: 8px 0;
        }

        .insight-panel {
            margin-top: 24px;
            border-top: 2px dashed var(--border-color);
            padding-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .insight-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        .insight-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        .insight-card .label {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .insight-card p {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .insight-card .placeholder {
            color: var(--text-muted);
            font-style: italic;
            font-size: 13px;
        }

        .thought-card {
            background: var(--bg-thought);
            border-radius: 14px;
            padding: 16px 20px;
            border-left: 5px solid var(--accent);
            transition: background 0.3s;
        }
        .thought-card .label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .thought-card p {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .refresh-btn {
            align-self: flex-end;
            background: var(--border-color);
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }
        .refresh-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .note-area {
            margin-top: 18px;
            padding: 14px 18px;
            background: var(--bg-note);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        .note-area .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .note-area .note-header span {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .note-area .note-header small {
            font-size: 11px;
            color: var(--text-muted);
        }
        .note-area textarea {
            width: 100%;
            min-height: 70px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            background: var(--bg-app);
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
        }
        .note-area textarea:focus {
            border-color: var(--accent);
        }
        .note-area .note-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .note-area .note-actions button {
            padding: 5px 16px;
            border: none;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .note-area .note-actions .save-note {
            background: var(--accent);
            color: #fff;
        }
        .note-area .note-actions .save-note:hover {
            background: var(--accent-hover);
        }
        .note-area .note-actions .clear-note {
            background: var(--border-color);
            color: var(--text-secondary);
        }
        .note-status {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 999;
            display: none;
        }
        .popup-overlay.active {
            display: block;
        }
        .badge-popup {
            position: fixed;
            max-width: 380px;
            background: var(--bg-app);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            padding: 20px 24px;
            z-index: 1000;
            display: none;
            border: 1px solid var(--border-color);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: background 0.3s;
        }
        .badge-popup.active {
            display: block;
        }
        .badge-popup .close-popup {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
        }
        .badge-popup .popup-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .badge-popup .popup-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .badge-popup .popup-body {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .footer-disclaimer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 8px 24px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .footer-disclaimer strong {
            color: var(--text-secondary);
        }

        @media (max-width: 860px) {
            .main {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 160px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                display: flex;
                flex-wrap: wrap;
                padding: 8px 10px;
                gap: 2px;
                overflow-y: auto;
            }
            .sidebar-group {
                width: 100%;
                margin-bottom: 2px;
            }
            .sidebar-group h4 {
                padding: 2px 8px;
                font-size: 10px;
            }
            .book-item {
                display: inline-block;
                padding: 3px 10px;
                font-size: 12px;
                border-left: none;
                border-radius: 20px;
            }
            .book-item.active {
                border-left: none;
                background: var(--accent);
                color: #fff;
            }
            .content {
                padding: 14px 14px;
                max-height: none;
            }
            .insight-row {
                grid-template-columns: 1fr;
            }
            .top-bar {
                padding: 10px 14px;
                flex-direction: column;
                align-items: stretch;
            }
            .top-bar .settings-group {
                justify-content: flex-start;
            }
            .search-bar {
                padding: 6px 14px 10px 14px;
            }
            .progress-bar {
                padding: 4px 14px;
                font-size: 11px;
            }
            .badge-popup {
                max-width: 92%;
                padding: 16px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <div class="disclaimer-banner">
            ⚠️ <strong>免责声明：</strong> 本站仅为《圣经》文献的学术性阅读、查阅与学习平台，不涉及任何宗教传教、布道或信仰劝导活动。请遵守国家法律法规，理性阅读。
        </div>

        <div class="top-bar">
            <div class="logo">📖 溪水旁 <span>· 文献阅读</span></div>
            <div class="spacer"></div>
            <div class="settings-group">
                <label>字号</label>
                <input type="range" id="fontSizeSlider" min="14" max="24" value="17" step="1">
                <span id="fontSizeLabel" style="font-size:13px;min-width:30px;">17</span>
                <label style="margin-left:6px;">底色</label>
                <select id="themeSelect">
                    <option value="cream">奶油</option>
                    <option value="sepia">护眼棕</option>
                    <option value="gray">高级灰</option>
                    <option value="dark">暗夜</option>
                </select>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索词、人名、地名、主题..." />
            <select id="searchType">
                <option value="all">全部</option>
                <option value="word">单字/词</option>
                <option value="person">人物</option>
                <option value="place">地名</option>
                <option value="topic">主题</option>
            </select>
            <button id="searchBtn">🔍 搜索</button>
        </div>

        <div class="progress-bar">
            <span class="progress-label">📅 年度读经计划</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>
            <span id="progressText">0 / 1189 章</span>
            <span style="font-size:11px;color:var(--text-muted);" id="progressDay">第 0 天</span>
        </div>

        <div class="main">
            <div class="sidebar" id="sidebar"></div>
            <div class="content" id="contentArea">
                <div class="breadcrumb" id="breadcrumb">📂 旧约 / <span>创世记</span> 第 1 章</div>
                <div class="search-results" id="searchResults"></div>
                <div class="verse-text" id="verseDisplay"></div>

                <div class="insight-panel" id="insightPanel">
                    <div class="insight-row">
                        <div class="insight-card" id="historyCard">
                            <div class="label">🏛️ 历史背景</div>
                            <p class="placeholder">加载中...</p>
                        </div>
                        <div class="insight-card" id="storyCard">
                            <div class="label">📜 文学关联</div>
                            <p class="placeholder">加载中...</p>
                        </div>
                        <div class="insight-card" id="futureCard">
                            <div class="label">🔮 文本指向</div>
                            <p class="placeholder">加载中...</p>
                        </div>
                    </div>
                    <div class="thought-card" id="thoughtCard">
                        <div class="label">📝 阅读思考</div>
                        <p class="placeholder">加载中...</p>
                    </div>
                    <button class="refresh-btn" id="refreshInsightBtn">🔄 刷新内容</button>
                </div>

                <div class="note-area" id="noteArea">
                    <div class="note-header">
                        <span>📝 私人笔记</span>
                        <small>仅保存在本设备，不上传服务器</small>
                    </div>
                    <textarea id="noteInput" placeholder="记录你的阅读思考、疑问或心得..."></textarea>
                    <div class="note-actions">
                        <button class="save-note" id="saveNoteBtn">💾 保存笔记</button>
                        <button class="clear-note" id="clearNoteBtn">🗑️ 清空</button>
                        <span class="note-status" id="noteStatus">📌 已自动保存</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-disclaimer">
            <strong>📌 本站声明：</strong> 本网站所有内容仅供 <strong>学术研究、文学阅读及历史文化学习</strong> 之用，不构成任何宗教传教、信仰劝导或仪式指导。
        </div>
    </div>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="badge-popup" id="badgePopup">
        <button class="close-popup" id="closePopup">✕</button>
        <div class="popup-title" id="popupTitle">名称</div>
        <div class="popup-sub" id="popupSub">分类</div>
        <div class="popup-body" id="popupBody">
            <p>简介内容...</p>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 圣经书籍列表
        // ============================================================
        const BIBLE_BOOKS = [
            { id: 'gen', name: '创世记', group: '摩西五经', abbrev: '创', chapters: 50 },

        // ============================================================
        // 3. 获取经文
        // ============================================================
        function getChapterText(bookId, chapter) {
            // 如果是创世记，从数据中读取
            if (bookId === 'gen' && GENESIS_DATA[chapter]) {
                const ch = GENESIS_DATA[chapter];
                let html = '';
                const verseKeys = Object.keys(ch).sort((a, b) => parseInt(a) - parseInt(b));
                for (const key of verseKeys) {
                    const v = ch[key];
                    if (v) {
                        const textWithBadges = applyBadges(v.zh);
                        html += `<span class="v">${key}</span> ${textWithBadges}<br>`;
                    }
                }
                return html || '<p style="color:var(--text-muted);">暂无经文数据</p>';
            }

            // 其他书卷：显示提示信息
            let html = '';
            const book = BIBLE_BOOKS.find(b => b.id === bookId);
            if (book) {
                html =
                    `<p style="color:var(--text-muted);">📖 《${book.name}》第 ${chapter} 章的经文数据正在录入中...</p>`;
                html +=
                    `<p style="color:var(--text-muted);font-size:14px;margin-top:8px;">💡 目前已收录：创世记第1章（完整中英文对照）</p>`;
            }
            return html;
        }

        // ============================================================
        // 5. 角标处理
        // ============================================================
        function applyBadges(text) {
            let result = text;
            for (const [name] of Object.entries(PERSON_DICT)) {
                const regex = new RegExp(name, 'g');
                result = result.replace(regex,
                    `<span class="badge-person" data-type="person" data-name="${name}">${name}</span>`
                );
            }
            for (const [name] of Object.entries(PLACE_DICT)) {
                const regex = new RegExp(name, 'g');
                result = result.replace(regex,
                    `<span class="badge-place" data-type="place" data-name="${name}">${name}</span>`
                );
            }
            return result;
        }

        // ============================================================
        // 6. 状态管理
        // ============================================================
        let currentBookId = 'gen';
        let currentChapter = 1;

        function loadBook(bookId, chapter = 1) {
            currentBookId = bookId;
            currentChapter = chapter;
            const book = BIBLE_BOOKS.find(b => b.id === bookId);
            if (!book) return;

            renderSidebar();
            document.getElementById('breadcrumb').innerHTML =
                `📂 ${book.group} / <span>${book.name}</span> 第 ${chapter} 章`;

            const verseHtml = getChapterText(bookId, chapter);
            document.getElementById('verseDisplay').innerHTML = verseHtml;

            loadNote(bookId, chapter);
            generateInsights(bookId, chapter);

            document.getElementById('searchResults').classList.remove('active');
            document.getElementById('searchResults').innerHTML = '';
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            let html = '';
            const groups = [...new Set(BIBLE_BOOKS.map(b => b.group))];
            groups.forEach(g => {
                html += `<div class="sidebar-group"><h4>${g}</h4>`;
                BIBLE_BOOKS.filter(b => b.group === g).forEach(b => {
                    const active = b.id === currentBookId ? 'active' : '';
                    html += `<div class="book-item ${active}" data-id="${b.id}">${b.abbrev} ${b.name}</div>`;
                });
                html += '</div>';
            });
            sidebar.innerHTML = html;
            sidebar.querySelectorAll('.book-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    if (id) loadBook(id, 1);
                });
            });
        }

        // ============================================================
        // 7. 笔记
        // ============================================================
        function getNoteKey(bookId, chapter) {
            return `note_${bookId}_${chapter}`;
        }

        function loadNote(bookId, chapter) {
            const key = getNoteKey(bookId, chapter);
            const note = localStorage.getItem(key);
            document.getElementById('noteInput').value = note || '';
            document.getElementById('noteStatus').textContent = note ? '📌 已加载笔记' : '📌 无笔记';
        }

        function saveNote(bookId, chapter) {
            const key = getNoteKey(bookId, chapter);
            localStorage.setItem(key, document.getElementById('noteInput').value);
            document.getElementById('noteStatus').textContent = '✅ 已保存';
            setTimeout(() => { document.getElementById('noteStatus').textContent = '📌 已保存'; }, 1500);
        }

            const fallbacks = {
                'gen': {
                    history: '创世记是希伯来圣经的第一卷书，传统认为作者为摩西，约主前15-13世纪成书。该卷书记载了从创造到埃及寄居的古代近东叙事。',
                    story: '创世记中的族长叙事（亚伯拉罕、以撒、雅各、约瑟）构成一个连续的家族史，与出埃及记形成叙事衔接。',
                    thought: '创世记以"起初"开篇，探讨了秩序与混沌、承诺与考验、家庭与民族等永恒主题，对后世文学与思想产生了深远影响。'
                }
            };
            const data = fallbacks[bookId] || fallbacks['gen'];
            document.querySelector('#historyCard p').innerHTML = data.history;
            document.querySelector('#storyCard p').innerHTML = data.story;
            document.querySelector('#futureCard p').innerHTML = data.thought;
            document.querySelector('#thoughtCard p').innerHTML = data.thought;
        }

        // ============================================================
        // 9. 搜索
        // ============================================================
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const type = document.getElementById('searchType').value;
            if (!query) { alert('请输入搜索内容'); return; }

            const results = document.getElementById('searchResults');
            results.innerHTML = '';
            results.classList.add('active');
            let found = false;

            if (type === 'all' || type === 'person') {
                for (const [name, data] of Object.entries(PERSON_DICT)) {
                    if (name.includes(query) || query.includes(name)) {
                        found = true;
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `<span class="ref">👤 人物</span> ${name} — ${data.sub}`;
                        div.addEventListener('click', () => showPopup('person', name));
                        results.appendChild(div);
                    }
                }
            }

            if (type === 'all' || type === 'place') {
                for (const [name, data] of Object.entries(PLACE_DICT)) {
                    if (name.includes(query) || query.includes(name)) {
                        found = true;
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.innerHTML = `<span class="ref">📍 地名</span> ${name} — ${data.sub}`;
                        div.addEventListener('click', () => showPopup('place', name));
                        results.appendChild(div);
                    }
                }
            }

            if (!found) {
                results.innerHTML = `<div class="no-result">🔍 未找到与 "${query}" 相关的内容</div>`;
            }
        }

        // ============================================================
        // 10. 弹出
        // ============================================================
        function showPopup(type, name) {
            const overlay = document.getElementById('popupOverlay');
            const popup = document.getElementById('badgePopup');
            const title = document.getElementById('popupTitle');
            const sub = document.getElementById('popupSub');
            const body = document.getElementById('popupBody');

            let data;
            if (type === 'person') data = PERSON_DICT[name];
            else if (type === 'place') data = PLACE_DICT[name];
            else return;
            if (!data) return;

            title.textContent = data.title;
            sub.textContent = data.sub;
            body.innerHTML = `<p>${data.body}</p>`;
            overlay.classList.add('active');
            popup.classList.add('active');
        }

        function hidePopup() {
            document.getElementById('popupOverlay').classList.remove('active');
            document.getElementById('badgePopup').classList.remove('active');
        }

        // ============================================================
        // 11. 进度
        // ============================================================
        function updateProgress() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 1);
            const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1;
            const chaptersPerDay = TOTAL_CHAPTERS / 365;
            const readChapters = Math.min(Math.floor(dayOfYear * chaptersPerDay), TOTAL_CHAPTERS);
            const percent = (readChapters / TOTAL_CHAPTERS * 100).toFixed(1);

            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = `${readChapters} / ${TOTAL_CHAPTERS} 章`;
            document.getElementById('progressDay').textContent = `第 ${dayOfYear} 天`;
        }

        // ============================================================
        // 12. 初始化
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            loadBook('gen', 1);
            updateProgress();

            // 字号
            const slider = document.getElementById('fontSizeSlider');
            const label = document.getElementById('fontSizeLabel');
            slider.addEventListener('input', () => {
                const size = parseInt(slider.value);
                label.textContent = size;
                document.documentElement.style.setProperty('--font-size', size + 'px');
            });

            // 主题
            document.getElementById('themeSelect').addEventListener('change', function() {
                document.documentElement.setAttribute('data-theme', this.value);
                localStorage.setItem('bible_theme', this.value);
            });
            const savedTheme = localStorage.getItem('bible_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelect').value = savedTheme;
            }

            // 搜索
            document.getElementById('searchBtn').addEventListener('click', performSearch);
            document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter')
                    performSearch(); });

            // 笔记
            document.getElementById('saveNoteBtn').addEventListener('click', () => saveNote(currentBookId,
            currentChapter));
            document.getElementById('clearNoteBtn').addEventListener('click', () => {
                if (confirm('确定清空笔记吗？')) {
                    const key = getNoteKey(currentBookId, currentChapter);
                    localStorage.removeItem(key);
                    document.getElementById('noteInput').value = '';
                    document.getElementById('noteStatus').textContent = '🗑️ 已清空';
                }
            });
            document.getElementById('noteInput').addEventListener('blur', () => saveNote(currentBookId, currentChapter));

            // 刷新洞察
            document.getElementById('refreshInsightBtn').addEventListener('click', () => generateInsights(currentBookId,
                currentChapter));

            // 角标点击
            document.getElementById('verseDisplay').addEventListener('click', (e) => {
                const t = e.target;
                if (t.classList.contains('badge-person')) showPopup('person', t.dataset.name);
                else if (t.classList.contains('badge-place')) showPopup('place', t.dataset.name);
            });

            document.getElementById('closePopup').addEventListener('click', hidePopup);
            document.getElementById('popupOverlay').addEventListener('click', hidePopup);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hidePopup(); });

            setInterval(updateProgress, 60000);
        });
    </script>

</body>
